<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COMMAND CENTER</title>
<style>
/* ============ TOKENS (monochrome ops console) ============ */
:root{
  --bg:#09090b;
  --s1:#131316;
  --s2:#18181b;
  --line:rgba(255,255,255,.07);
  --line-strong:rgba(255,255,255,.14);
  --tx:#fafafa;
  --tx2:#a1a1aa;
  --tx3:#52525b;
  --accent:#22d3ee;
  --ok:#34d399;
  --warn:#f59e0b;
  --danger:#f87171;
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
  --t-fast:.15s;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);color:var(--tx);
  font-family:var(--sans);font-size:13px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
.mono{font-family:var(--mono)}
::selection{background:rgba(34,211,238,.25)}

/* ============ LAYOUT ============ */
.app{display:grid;grid-template-columns:212px 1fr;grid-template-rows:52px 1fr;height:100vh}
.topbar{
  grid-column:1/-1;display:flex;align-items:center;gap:16px;
  padding:0 18px;border-bottom:1px solid var(--line);background:rgba(9,9,11,.85);
  backdrop-filter:blur(8px);z-index:5;user-select:none;
}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:18px;height:18px;border:1.5px solid var(--tx);transform:rotate(45deg);position:relative}
.brand-mark::after{content:"";position:absolute;inset:3px;border:1px solid var(--accent)}
.brand-name{font-weight:600;letter-spacing:.14em;font-size:12px}
.brand-sub{font-family:var(--mono);font-size:10px;color:var(--tx3);letter-spacing:.08em}
.topbar .spacer{flex:1}
.pill{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 10px;border:1px solid var(--line-strong);border-radius:999px;color:var(--tx2);
  display:inline-flex;align-items:center;gap:6px;background:var(--s1);
}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.pill.warn .dot{background:var(--warn)}
.clock{font-family:var(--mono);font-size:12px;color:var(--tx2);min-width:110px;text-align:right}
.kbd{
  font-family:var(--mono);font-size:10px;border:1px solid var(--line-strong);border-radius:5px;
  padding:2px 6px;color:var(--tx3);background:var(--s1);
}
.btn{
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  padding:5px 12px;border-radius:6px;border:1px solid var(--line-strong);background:var(--s2);
  color:var(--tx2);cursor:pointer;transition:border-color var(--t-fast),color var(--t-fast),background var(--t-fast);
}
.btn:hover{border-color:var(--line-strong);color:var(--tx);background:#202024}
.btn.primary{background:var(--tx);color:#09090b;border-color:var(--tx);font-weight:600}
.btn.primary:hover{background:#e4e4e7;border-color:#e4e4e7}

/* ============ SIDE NAV ============ */
.sidenav{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav-group{
  font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--tx3);padding:12px 10px 6px;
}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;
  font-size:12px;color:var(--tx2);cursor:pointer;border:1px solid transparent;
  transition:color var(--t-fast),background var(--t-fast);user-select:none;
}
.nav-item:hover{color:var(--tx);background:var(--s1)}
.nav-item.active{color:var(--tx);background:var(--s1);border-color:var(--line)}
.nav-item.active::before{content:"";width:3px;height:12px;background:var(--accent);border-radius:2px;margin-left:-10px}
.nav-item .ico{width:14px;height:14px;opacity:.7;flex:none}
.nav-item .count{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--tx3)}
.nav-item .count.ok{color:var(--ok)}

/* ============ MAIN ============ */
.main{padding:18px 20px 26px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.section-head{display:flex;align-items:center;gap:12px;user-select:none}
.section-head h1{font-size:15px;font-weight:600;letter-spacing:-.01em}
.section-head .meta{font-family:var(--mono);font-size:10px;color:var(--tx3);letter-spacing:.08em}
.section-head .spacer{flex:1}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{
  background:var(--s1);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;display:flex;flex-direction:column;gap:6px;
}
.kpi .label{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3)}
.kpi .value{font-family:var(--mono);font-size:24px;font-weight:500;letter-spacing:-.02em;line-height:1}
.kpi .delta{font-family:var(--mono);font-size:10px;color:var(--tx3)}
.kpi .delta.up{color:var(--ok)}
.kpi .delta.down{color:var(--danger)}

/* Bento grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{
  background:var(--s1);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;position:relative;
  transition:border-color var(--t-fast),background var(--t-fast);
}
.card:hover{border-color:var(--line-strong);background:var(--s2)}
.card.wide{grid-column:span 2}
.card .row1{display:flex;align-items:center;gap:8px}
.card .name{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx2);font-weight:500}
.card .actions{margin-left:auto;display:flex;gap:4px;opacity:0;transition:opacity var(--t-fast)}
.card:hover .actions{opacity:1}
.card .metric{font-family:var(--mono);font-size:26px;font-weight:500;letter-spacing:-.02em;line-height:1}
.card .metric .unit{font-size:11px;color:var(--tx3);margin-left:4px}
.card .row2{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.card .sub{font-family:var(--mono);font-size:10px;color:var(--tx3);display:flex;flex-direction:column;gap:3px}
.card .sub b{color:var(--tx2);font-weight:500}
.card .spark{flex:none}
.card .last{font-family:var(--mono);font-size:9px;color:var(--tx3);letter-spacing:.04em;border-top:1px solid var(--line);padding-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* status pill */
.status{
  font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 8px;border-radius:999px;border:1px solid;display:inline-flex;align-items:center;gap:5px;
}
.status.live{color:var(--ok);border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.08)}
.status.live .dot{background:var(--ok)}
.status.warn{color:var(--warn);border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.08)}
.status.warn .dot{background:var(--warn)}
.status.err{color:var(--danger);border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.08)}
.status.err .dot{background:var(--danger)}
.status.idle{color:var(--tx3);border-color:var(--line-strong);background:var(--s1)}
.status.idle .dot{background:var(--tx3)}
.status .dot{width:5px;height:5px;border-radius:50%;display:inline-block}

/* bottom split */
.bottom{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;min-height:230px}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden}
.panel .panel-head{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line)}
.panel .panel-head .name{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx2)}
.panel .panel-head .count{font-family:var(--mono);font-size:10px;color:var(--tx3);margin-left:auto}

/* event feed */
.feed{flex:1;overflow:hidden;position:relative}
.feed-row{
  display:flex;align-items:center;gap:10px;padding:7px 14px;font-family:var(--mono);font-size:11px;
  border-bottom:1px solid rgba(255,255,255,.03);
}
.feed-row .t{color:var(--tx3);flex:none}
.feed-row .src{flex:none;font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border:1px solid var(--line-strong);border-radius:4px;color:var(--tx2);min-width:64px;text-align:center}
.feed-row .msg{color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed-row.ok .src{color:var(--ok);border-color:rgba(52,211,153,.3)}
.feed-row.warn .src{color:var(--warn);border-color:rgba(245,158,11,.3)}
.feed-row.err .src{color:var(--danger);border-color:rgba(248,113,113,.3)}

/* jobs */
.jobs{flex:1;display:flex;flex-direction:column;gap:12px;padding:14px}
.job .job-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.job .job-name{font-family:var(--mono);font-size:11px;color:var(--tx2)}
.job .job-pct{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--tx3)}
.job .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden}
.job .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:2px;transform-origin:left center}
.job .job-meta{font-family:var(--mono);font-size:9px;color:var(--tx3);margin-top:4px}

/* command palette */
.palette-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);z-index:50;opacity:0;pointer-events:none}
.palette-bg.open{opacity:1;pointer-events:auto}
.palette{
  position:fixed;top:12vh;left:50%;transform:translateX(-50%) scale(.98) translateY(-6px);
  width:560px;max-width:92vw;background:#101013;border:1px solid var(--line-strong);border-radius:12px;
  box-shadow:0 24px 80px rgba(0,0,0,.6);z-index:51;opacity:0;pointer-events:none;overflow:hidden;
}
.palette.open{opacity:1;pointer-events:auto}
.palette input{
  width:100%;background:transparent;border:none;outline:none;color:var(--tx);
  font-family:var(--mono);font-size:14px;padding:16px 18px;border-bottom:1px solid var(--line);
}
.palette input::placeholder{color:var(--tx3)}
.palette .results{max-height:320px;overflow-y:auto;padding:6px}
.palette .res-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:7px;cursor:pointer;
  font-family:var(--mono);font-size:12px;color:var(--tx2);
}
.palette .res-item:hover,.palette .res-item.sel{background:var(--s2);color:var(--tx)}
.palette .res-item .grp{margin-left:auto;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3)}
.palette .hints{display:flex;gap:14px;padding:9px 18px;border-top:1px solid var(--line);font-family:var(--mono);font-size:9px;color:var(--tx3);letter-spacing:.06em}

/* scrollbar */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* reduced motion */
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app">

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <div class="brand-name">COMMAND CENTER</div>
        <div class="brand-sub">// control-plane rnd</div>
      </div>
    </div>
    <div class="pill" id="env-pill"><span class="dot" id="env-dot"></span>systems nominal</div>
    <div class="spacer"></div>
    <button class="btn primary" id="btn-refresh">Refresh</button>
    <span class="kbd">CTRL K</span>
    <div class="clock mono" id="clock">--:--:--</div>
  </header>

  <!-- SIDE NAV -->
  <nav class="sidenav">
    <div class="nav-group">Control</div>
    <div class="nav-item active" data-sec="overview"><span class="ico">&#9632;</span>Overview</div>
    <div class="nav-item" data-sec="farms"><span class="ico">&#9651;</span>Farms<span class="count ok" id="nav-farms">2</span></div>
    <div class="nav-item" data-sec="proxy"><span class="ico">&#8645;</span>Proxy<span class="count ok" id="nav-proxy">42</span></div>
    <div class="nav-item" data-sec="gw"><span class="ico">&#8743;</span>Gateways<span class="count ok" id="nav-gw">3</span></div>
    <div class="nav-item" data-sec="hosts"><span class="ico">&#9637;</span>Hosts<span class="count" id="nav-hosts">5</span></div>
    <div class="nav-group">Automation</div>
    <div class="nav-item" data-sec="shop"><span class="ico">&#9672;</span>Shop</div>
    <div class="nav-item" data-sec="events"><span class="ico">&#9776;</span>Events<span class="count" id="nav-events">0</span></div>
  </nav>

  <!-- MAIN -->
  <main class="main" id="main">
    <div class="section-head">
      <h1 id="sec-title">Overview</h1>
      <span class="meta mono" id="sec-meta">08:00:00 WIB · 12 systems tracked</span>
      <span class="spacer"></span>
    </div>

    <!-- KPI -->
    <div class="kpis" id="kpis"></div>

    <!-- BENTO GRID -->
    <div class="grid" id="grid"></div>

    <!-- BOTTOM -->
    <div class="bottom">
      <div class="panel">
        <div class="panel-head"><span class="name">Event Feed</span><span class="count mono" id="feed-count">0 events</span></div>
        <div class="feed" id="feed"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><span class="name">Active Jobs</span><span class="count mono">3 running</span></div>
        <div class="jobs" id="jobs"></div>
      </div>
    </div>
  </main>
</div>

<!-- COMMAND PALETTE -->
<div class="palette-bg" id="palette-bg"></div>
<div class="palette" id="palette">
  <input type="text" id="palette-input" placeholder="Type a command or navigate...">
  <div class="results" id="palette-results"></div>
  <div class="hints"><span>&uarr;&darr; navigate</span><span>&crarr; run</span><span>esc close</span><span>monochrome mode</span></div>
</div>

<script src="./lib/anime.min.js"></script>
<script>
/* ============ SYNTHETIC DATA (no real infra values) ============ */
const SYSTEMS = [
  {id:'gw',   grp:'farms', name:'Router',        metric:'4,214', unit:'req/min', status:'live', sub:[['keys','1,931'],['latency','38ms']], last:'key add ok · 12s ago',      spark:[40,55,48,70,64,82,74,91]},
  {id:'grok', grp:'farms', name:'Pool',          metric:'1930',  unit:'/1931',   status:'live', sub:[['quota','99.9%'],['tier','clean']],  last:'quota sweep · 41s ago',      spark:[88,85,90,86,92,89,95,93]},
  {id:'mist', grp:'farms', name:'Mist Farm',     metric:'603',   unit:'keys',    status:'live', sub:[['batch','12/14'],['ok','100%']],  last:'batch 12 done · 2m ago',     spark:[20,35,45,42,60,55,70,74]},
  {id:'rail', grp:'farms', name:'Rail Farm',     metric:'4',     unit:'accts',   status:'live', sub:[['quota','6/IP'],['rotate','2m']],  last:'rotation ok · 3m ago',       spark:[30,32,28,35,40,38,42,45]},
  {id:'proxy',grp:'proxy', name:'Proxy Pool',    metric:'42',    unit:'/48 alive',status:'live',sub:[['egress','5'],['fail','0']],    last:'health sweep · 21s ago',     spark:[60,62,58,66,70,68,72,71]},
  {id:'warp', grp:'proxy', name:'Warp Egress',   metric:'5',     unit:'nodes',   status:'warn', sub:[['deg','1'],['uptime','99.2%']], last:'node slow · 55s ago',         spark:[70,74,72,68,66,70,64,60]},
  {id:'sub',  grp:'gw',    name:'Sub2API',       metric:'23',    unit:'routes',  status:'live', sub:[['calls','1.2k'],['p50','120ms']], last:'route sync · 8s ago',        spark:[50,52,55,53,60,58,63,66]},
  {id:'free', grp:'gw',    name:'FreeBuff',      metric:'1,042', unit:'req',     status:'live', sub:[['up','99.8%'],['p99','410ms']], last:'upstream ok · 33s ago',      spark:[70,68,72,75,73,78,76,80]},
  {id:'bot',  grp:'gw',    name:'Boterdrop',     metric:'OK',    unit:'',        status:'live', sub:[['queue','3'],['busy','no']],   last:'health 200 · 15s ago',       spark:[45,50,48,52,50,55,53,56]},
  {id:'dude', grp:'hosts', name:'Host D',        metric:'23%',   unit:'cpu',     status:'live', sub:[['mem','41%'],['disk','83%']], last:'load nominal · 9s ago',      spark:[35,40,38,30,45,42,36,33]},
  {id:'suki', grp:'hosts', name:'Host S',        metric:'11%',   unit:'cpu',     status:'idle', sub:[['mem','29%'],['disk','61%']], last:'idle · 1m ago',               spark:[25,22,28,24,21,26,23,20]},
  {id:'shop', grp:'shop',  name:'Crosslist',     metric:'3',     unit:'items',   status:'live', sub:[['sync','ok'],['queue','0']],  last:'sku sync · 4m ago',          spark:[60,64,62,68,66,70,68,72]},
];
const JOBS = [
  {name:'mist batch 13', pct:64,  meta:'mist farm · 64/100 accounts · eta 4m'},
  {name:'proxy rotate',  pct:38,  meta:'egress sweep · node 3 of 8'},
  {name:'feed archive',  pct:91,  meta:'event retention · finalizing'},
];
const FEED_POOL = [
  {src:'ROUTER',  msg:'key rotation complete · 12 keys reissued'},
  {src:'POOL',    msg:'quota sweep: 1,930/1,931 slots warm'},
  {src:'MIST',    msg:'batch 12 finished · 100/100 verified'},
  {src:'PROXY',   msg:'health sweep · 42 alive, 0 failures'},
  {src:'WARP',    msg:'egress node slow · auto-reconnect'},
  {src:'SUB2API', msg:'route manifest updated · 23 routes'},
  {src:'FREE',    msg:'upstream healthy · p99 410ms'},
  {src:'CROSS',   msg:'sku 3/3 synced to marketplace'},
  {src:'HOST D',  msg:'load nominal · cpu 23% mem 41%'},
  {src:'BOT',     msg:'health check 200 · queue depth 3'},
];

/* ============ RENDER ============ */
const $=s=>document.querySelector(s);
const grid=$('#grid'), feed=$('#feed'), jobsBox=$('#jobs'), kpis=$('#kpis');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

function sparkSVG(data){
  const w=74,h=26,pad=2,max=Math.max(...data),min=Math.min(...data);
  const pts=data.map((v,i)=>{
    const x=pad+(w-2*pad)*(i/(data.length-1));
    const y=h-pad-((v-min)/(max-min||1))*(h-2*pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" fill="none">
    <polyline points="${pts}" stroke="rgba(255,255,255,.38)" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${pts.split(' ').pop().split(',')[0]}" cy="${pts.split(' ').pop().split(',')[1]}" r="2" fill="rgba(255,255,255,.75)"/>
  </svg>`;
}

function statusPill(s){
  const map={live:['live',''],warn:['warn',''],err:['err',''],idle:['idle','']};
  const [cls]=map[s]||map.idle;
  return `<span class="status ${cls}"><span class="dot"></span>${s}</span>`;
}

function renderCards(){
  grid.innerHTML=SYSTEMS.map((s,i)=>`
    <div class="card" data-id="${s.id}" data-grp="${s.grp}" data-idx="${i}">
      <div class="row1">
        <span class="name">${s.name}</span>
        ${statusPill(s.status)}
        <span class="actions">
          <button class="btn" title="open">Open</button>
          <button class="btn" title="restart">Restart</button>
        </span>
      </div>
      <div class="metric mono">${s.metric}${s.unit?`<span class="unit">${s.unit}</span>`:''}</div>
      <div class="row2">
        <div class="sub">${s.sub.map(([k,v])=>`<span>${k} <b>${v}</b></span>`).join('')}</div>
        ${sparkSVG(s.spark)}
      </div>
      <div class="last">${s.last}</div>
    </div>`).join('');
}

function renderKPIs(){
  const data=[
    ['systems','12','mono',['10 live · 1 warn · 1 idle'],''],
    ['live keys','2,534','mono',['+18 this hour'],'up'],
    ['req/min','5,256','mono',['+4.2% vs avg'],'up'],
    ['events','1,204','mono',['last 24h'],''],
  ];
  kpis.innerHTML=data.map(([l,v,u,d,cls])=>`
    <div class="kpi">
      <div class="label">${l}</div>
      <div class="value mono">${v}</div>
      <div class="delta ${cls}">${d}</div>
    </div>`).join('');
}

function renderJobs(){
  jobsBox.innerHTML=JOBS.map((j,i)=>`
    <div class="job">
      <div class="job-top">
        <span class="job-name">${j.name}</span>
        <span class="job-pct mono" data-pct="${j.pct}">0%</span>
      </div>
      <div class="bar"><i data-w="${j.pct}"></i></div>
      <div class="job-meta">${j.meta}</div>
    </div>`).join('');
}

function renderFeed(n=6){
  feed.innerHTML='';
  for(let i=n-1;i>=0;i--){
    const e=FEED_POOL[(FEED_POOL.length-1-i)%FEED_POOL.length];
    const cls=i===0?'ok':i%3===0?'warn':'';
    feed.insertAdjacentHTML('afterbegin',`<div class="feed-row ${cls}"><span class="t">${nowStr()}</span><span class="src">${e.src}</span><span class="msg">${e.msg}</span></div>`);
  }
}

/* ============ LIVE CLOCK ============ */
function nowStr(){return new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Jakarta',hour12:false})}
setInterval(()=>{$('#clock').textContent=nowStr()+' WIB'},1000);
$('#clock').textContent=nowStr()+' WIB';

/* ============ ANIME ENTRANCE ============ */
function boot(){
  renderKPIs();renderCards();renderJobs();renderFeed();

  if(reduced){// static fallback
    document.querySelectorAll('.job-pct').forEach(el=>el.textContent=el.dataset.pct+'%');
    document.querySelectorAll('.bar i').forEach(el=>el.style.width=el.dataset.w+'%');
    return;
  }

  // entrance timeline
  const tl=anime.timeline({easing:'easeOutExpo'});
  tl.add({targets:'.topbar',translateY:[-14,0],opacity:[0,1],duration:500},0)
    .add({targets:'.sidenav .nav-item',translateY:[-8,0],opacity:[0,1],duration:400,delay:anime.stagger(30,{start:80})},0)
    .add({targets:'.kpi',translateY:[14,0],opacity:[0,1],duration:500,delay:anime.stagger(45,{start:150})},100)
    .add({targets:'.card',translateY:[16,0],opacity:[0,1],scale:[.985,1],duration:550,delay:anime.stagger(35,{start:250})},150)
    .add({targets:'.panel',translateY:[12,0],opacity:[0,1],duration:450,delay:anime.stagger(60,{start:200})},250)
    .add({targets:'.feed-row',translateY:[-6,0],opacity:[0,1],duration:350,delay:anime.stagger(25,{start:100})},350)
    .add({targets:'.job',translateY:[8,0],opacity:[0,1],duration:350,delay:anime.stagger(50,{start:100})},350);

  // number tickers (KPI values)
  const kpiVals=[12,2534,5256,1204];
  document.querySelectorAll('.kpi .value').forEach((el,i)=>{
    const target=kpiVals[i];
    const obj={v:0};
    anime({targets:obj,v:target,easing:'easeOutQuart',duration:1100,delay:600,
      update:()=>{el.textContent=target>999?obj.v.toLocaleString('en-US'):Math.round(obj.v)}}
    );
  });

  // job progress bars
  document.querySelectorAll('.job').forEach((job,ji)=>{
    const bar=job.querySelector('.bar i'),pct=job.querySelector('.job-pct');
    anime({targets:bar,scaleX:[0,1],easing:'easeInOutQuad',duration:900,delay:800+ji*120,
      begin:()=>{bar.style.transformOrigin='left center'},
      update:()=>{pct.textContent=Math.round(bar._anim?bar._anim.progress*parseInt(pct.dataset.pct)/100:0)+'%'}
    });
  });

  // live dot pulse
  anime({targets:'.status.live .dot',scale:[1,1.6],opacity:[1,.4],duration:900,easing:'easeInOutQuad',loop:true,delay:anime.stagger(400)});
  anime({targets:'#env-dot',scale:[1,1.5],opacity:[1,.5],duration:1100,easing:'easeInOutQuad',loop:true});
}

/* ============ EVENT FEED STREAM ============ */
let feedN=0;
function pushFeed(){
  const e=FEED_POOL[feedN%FEED_POOL.length];feedN++;
  const row=document.createElement('div');
  row.className='feed-row ok';row.innerHTML=`<span class="t">${nowStr()}</span><span class="src">${e.src}</span><span class="msg">${e.msg}</span>`;
  feed.prepend(row);
  const count=feed.querySelectorAll('.feed-row').length;
  if(count>8)feed.removeChild(feed.lastChild);
  $('#feed-count').textContent=count+' events';
  if(!reduced)anime({targets:row,translateY:[-8,0],opacity:[0,1],duration:350,easing:'easeOutQuad'});
}
setInterval(pushFeed,4000);

/* ============ COMMAND PALETTE ============ */
const CMDS=[
  {label:'go overview', grp:'nav'},
  {label:'go farms', grp:'nav'},
  {label:'go proxy', grp:'nav'},
  {label:'go hosts', grp:'nav'},
  {label:'restart proxy pool', grp:'run'},
  {label:'rotate egress', grp:'run'},
  {label:'refresh status', grp:'run'},
  {label:'open command center docs', grp:'open'},
];
const bg=$('#palette-bg'),pal=$('#palette'),pin=$('#palette-input'),pres=$('#palette-results');
let open=false;
function paletteOpen(){
  open=true;bg.classList.add('open');pal.classList.add('open');
  pin.value='';paletteFilter();pin.focus();
  if(!reduced){
    anime({targets:bg,opacity:[0,1],duration:150,easing:'linear'});
    anime({targets:pal,scale:[.98,1],translateY:[-6,0],opacity:[0,1],duration:250,easing:'easeOutExpo'});
  }
}
function paletteClose(){
  open=false;bg.classList.remove('open');pal.classList.remove('open');
  if(!reduced)anime({targets:pal,scale:[1,.98],translateY:[0,-6],opacity:[1,0],duration:150,easing:'easeInQuad'});
}
function paletteFilter(){
  const q=pin.value.toLowerCase();
  pres.innerHTML=CMDS.filter(c=>c.label.includes(q)||c.grp.includes(q))
    .map((c,i)=>`<div class="res-item${i===0?' sel':''}" data-i="${i}"><span>${c.label}</span><span class="grp">${c.grp}</span></div>`).join('');
}
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();open?paletteClose():paletteOpen();}
  if(open&&e.key==='Escape')paletteClose();
});
bg.addEventListener('click',paletteClose);
pin.addEventListener('input',paletteFilter);
document.querySelectorAll('.kbd').forEach(k=>k.style.cursor='pointer');
document.querySelector('.kbd').addEventListener('click',paletteOpen);

/* ============ NAV ============ */
document.querySelectorAll('.nav-item').forEach(item=>{
  item.addEventListener('click',()=>{
    document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
    item.classList.add('active');
    const sec=item.dataset.sec;
    $('#sec-title').textContent=sec.charAt(0).toUpperCase()+sec.slice(1);
    $('#sec-meta').textContent=nowStr()+' WIB · '+sec;
    const grp=sec==='overview'?'':sec;
    document.querySelectorAll('.card').forEach(c=>{
      const show=!grp||c.dataset.grp===grp||(grp==='events');
      c.style.display=show?'':'none';
    });
  });
});

/* ============ CARD CLICK ============ */
grid.addEventListener('click',e=>{
  const card=e.target.closest('.card');if(!card)return;
  const s=SYSTEMS[+card.dataset.idx];
  pushFeed(); // demo: every interaction emits an event
  // reset a subtle ping on the card
  if(!reduced)anime({targets:card,scale:[1,.992,1],duration:180,easing:'easeOutQuad'});
});

/* refresh button: re-run boot entrance */
let booted=false;
$('#btn-refresh').addEventListener('click',()=>{
  if(!booted){booted=true;boot();}else{location.reload();}
});

/* ============ INIT ============ */
boot();
$('#btn-refresh').textContent='Reload';
</script>
</body>
</html>
